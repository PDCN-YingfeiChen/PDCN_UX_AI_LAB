<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>PDCN UX Helper</title>
    <style>
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --accent: #111827;
        --accent-hover: #000000;
        --border: #cbd5e1;
        --surface: #e2e8f0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 16px;
        font-family: "SF Pro Text", "Segoe UI", sans-serif;
        color: var(--text);
        background: var(--bg);
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
      }

      h2 {
        margin: 0 0 8px;
        font-size: 14px;
      }

      p {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      textarea {
        width: 100%;
        min-height: 320px;
        border-radius: 8px;
        border: 1px solid var(--border);
        padding: 10px;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 11px;
        line-height: 1.4;
        resize: vertical;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
        margin-bottom: 10px;
      }

      button {
        border: none;
        border-radius: 8px;
        padding: 9px 10px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }

      .primary {
        background: var(--accent);
        color: white;
      }

      .primary:hover {
        background: var(--accent-hover);
      }

      .secondary {
        background: var(--surface);
        color: var(--text);
      }

      .status {
        margin-top: 10px;
        font-size: 11px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <section class="card" aria-labelledby="title">
      <h2 id="title">组件提取</h2>
      <p>选中组件或实例后读取 key；也可以扫描当前文件中的全部组件，结果会显示在下方。</p>
      <div class="actions">
        <button id="readKeys" class="secondary" type="button">读取选中组件 key</button>
        <button id="scanAll" class="primary" type="button">扫描当前文件全部组件</button>
      </div>
      <textarea id="keysOut" readonly placeholder="组件 key 会显示在这里。"></textarea>
      <div class="status" id="keysStatus">Idle</div>
    </section>

    <script>
      const keysStatusEl = document.getElementById("keysStatus");
      const keysOut = document.getElementById("keysOut");

      document.getElementById("readKeys").onclick = () => {
        parent.postMessage({ pluginMessage: { type: "read-keys" } }, "*");
        keysStatusEl.textContent = "Reading selection...";
      };

      document.getElementById("scanAll").onclick = () => {
        parent.postMessage({ pluginMessage: { type: "scan-all-keys" } }, "*");
        keysStatusEl.textContent = "Scanning all components...";
      };

      onmessage = (event) => {
        const msg = event.data.pluginMessage;
        if (!msg) {
          return;
        }

        if (msg.type === "keys-result") {
          keysStatusEl.textContent = msg.message || "";
          keysOut.value = (msg.keys || [])
            .map((keyInfo) => {
              const node = {
                type: "instance",
                name: keyInfo.name,
                key: keyInfo.key,
              };
              if (keyInfo.setKey && keyInfo.setKey !== keyInfo.key) {
                node.setKey = keyInfo.setKey;
              }
              return JSON.stringify(node);
            })
            .join("\n");
        }

        if (msg.type === "scan-result") {
          keysStatusEl.textContent = msg.message || "";
          keysOut.value = JSON.stringify(msg.dictionary || {}, null, 2);
        }
      };
    </script>
  </body>
</html>
